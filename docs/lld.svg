<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui,Segoe UI,sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a90a0"/></marker></defs>
<rect width="1200" height="900" fill="#0c0d10"/>
<text x="600" y="38" text-anchor="middle" fill="#eceef3" font-size="24" font-weight="700">synaptree-mcp - Low-level design</text>
<rect x="30" y="70" width="360" height="300" rx="10" fill="#14161b" stroke="#3ddc97" stroke-width="2"/>
<text x="44" y="98" fill="#3ddc97" font-size="19" font-weight="700">Entry and API</text>
<text x="44" y="128" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">cli.js   serve | --stdio</text>
<text x="44" y="152" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">config.js .env -> loadConfig</text>
<text x="44" y="176" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">server.js express routes</text>
<text x="44" y="200" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  GET /sse  POST /messages</text>
<text x="44" y="224" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  /api/v1/{graph,trace,chat,sync}</text>
<text x="44" y="248" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">tools.js  add(name,schema,fn)</text>
<text x="44" y="272" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  runTool -> zod -> handler</text>
<text x="44" y="296" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">mcp.js   MCP SDK bridge</text>
<text x="44" y="320" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">savings.js baseline vs reply</text>
<rect x="420" y="70" width="360" height="300" rx="10" fill="#14161b" stroke="#ffa94d" stroke-width="2"/>
<text x="434" y="98" fill="#ffa94d" font-size="19" font-weight="700">Indexing pipeline</text>
<text x="434" y="128" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">indexer.walk(root, ignore)</text>
<text x="434" y="152" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">sha256 -> skip unchanged</text>
<text x="434" y="176" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">parser.js  load grammar WASM</text>
<text x="434" y="200" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">extract.extractTree(tree,src)</text>
<text x="434" y="224" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  defs, imports, call refs</text>
<text x="434" y="248" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">linker.buildFile -> nodes</text>
<text x="434" y="272" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">linker.NameIndex(name->qn)</text>
<text x="434" y="296" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">linker.linkRefs(pending)</text>
<text x="434" y="320" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  1 match: CALLS, n>1: USAGE</text>
<rect x="810" y="70" width="360" height="300" rx="10" fill="#14161b" stroke="#c77dff" stroke-width="2"/>
<text x="824" y="98" fill="#c77dff" font-size="19" font-weight="700">Graph store (db.js)</text>
<text x="824" y="128" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">session per tenant</text>
<text x="824" y="152" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">purge(file) then write</text>
<text x="824" y="176" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">UNWIND $rows (500/batch)</text>
<text x="824" y="200" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">MERGE (:CodeNode {qn,user_id,</text>
<text x="824" y="224" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  repo_name}) SET labels</text>
<text x="824" y="248" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">MERGE edges by type</text>
<text x="824" y="272" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">constraint unique_code_entity</text>
<text x="824" y="296" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">index code_embedding_idx</text>
<text x="824" y="320" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">traceRows: var-length path,</text>
<text x="824" y="344" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  ORDER BY hops LIMIT 200</text>
<rect x="30" y="410" width="360" height="230" rx="10" fill="#14161b" stroke="#7fe0ff" stroke-width="2"/>
<text x="44" y="438" fill="#7fe0ff" font-size="19" font-weight="700">Query tools</text>
<text x="44" y="468" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">search_graph  fulltext + label</text>
<text x="44" y="492" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">search_code   regex on disk</text>
<text x="44" y="516" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">get_code_snippet stored src</text>
<text x="44" y="540" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">trace_path    in/out/both 1-5</text>
<text x="44" y="564" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">query_graph   RO Cypher, 500 rows</text>
<text x="44" y="588" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">get_architecture counts, folders</text>
<rect x="420" y="410" width="360" height="230" rx="10" fill="#14161b" stroke="#ff6b6b" stroke-width="2"/>
<text x="434" y="438" fill="#ff6b6b" font-size="19" font-weight="700">Safety</text>
<text x="434" y="468" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">write clause -> HttpError 403</text>
<text x="434" y="492" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">$user_id/$repo_name required</text>
<text x="434" y="516" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">delete_project: name +</text>
<text x="434" y="540" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  'yes, delete my repo'</text>
<text x="434" y="564" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">bind 127.0.0.1, bearer token</text>
<text x="434" y="588" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">repo + source DBs never written</text>
<rect x="810" y="410" width="360" height="230" rx="10" fill="#14161b" stroke="#4d8dff" stroke-width="2"/>
<text x="824" y="438" fill="#4d8dff" font-size="19" font-weight="700">LLM + ERD</text>
<text x="824" y="468" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">llm.gate(scope,tokens,args)</text>
<text x="824" y="492" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">complete() local | api</text>
<text x="824" y="516" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">erd.js introspect read-only</text>
<text x="824" y="540" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">erd-ai.js infer relations</text>
<text x="824" y="564" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">schema-graph.modelToGraph</text>
<text x="824" y="588" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">  repo_name = db:<id></text>
<rect x="30" y="680" width="1140" height="170" rx="10" fill="#14161b" stroke="#8a90a0" stroke-width="2"/>
<text x="44" y="708" fill="#8a90a0" font-size="19" font-weight="700">Write path of one file (client or index_repository)</text>
<text x="44" y="738" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">write: sha256 changed? -> extractTree -> buildFile -> linkRefs -> purge -> UNWIND MERGE nodes, edges</text>
<text x="44" y="762" fill="#eceef3" font-size="16" font-family="ui-monospace,Consolas,monospace">read: /trace -> nodeByQn -> traceRows(depth<=5, no tests) -> lanes -> {nodes, edges<=1000}</text>
<path d="M390 220 H418" stroke="#8a90a0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M780 220 H808" stroke="#8a90a0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M990 372 V408" stroke="#8a90a0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M210 372 V408" stroke="#8a90a0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>
