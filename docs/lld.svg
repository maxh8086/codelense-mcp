<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,Segoe UI,sans-serif" font-size="13">
  <rect width="960" height="560" fill="#0c0d10"/>
  <text x="480" y="32" text-anchor="middle" fill="#eceef3" font-size="18" font-weight="700">codelense-mcp - Low-level design</text>
  <g>
    <rect x="30" y="60" width="280" height="200" rx="12" fill="#14161b" stroke="#3ddc97"/>
    <text x="170" y="84" text-anchor="middle" fill="#3ddc97" font-weight="700">Entry: src/cli.js</text>
    <text x="50" y="112" fill="#eceef3">serve | --stdio</text>
    <text x="50" y="136" fill="#eceef3">config.js (.env authoritative)</text>
    <text x="50" y="160" fill="#eceef3">server.js (express: /sse, /api/v1, /ui)</text>
    <text x="50" y="184" fill="#eceef3">tools.js (MCP tool registry, zod)</text>
    <text x="50" y="208" fill="#eceef3">llm.js (estimate, approve, budget)</text>
    <text x="50" y="232" fill="#eceef3">default bind 127.0.0.1</text>
  </g>
  <g>
    <rect x="340" y="60" width="280" height="200" rx="12" fill="#14161b" stroke="#ffa94d"/>
    <text x="480" y="84" text-anchor="middle" fill="#ffa94d" font-weight="700">Indexing pipeline</text>
    <text x="360" y="112" fill="#eceef3">discover files (language registry)</text>
    <text x="360" y="136" fill="#eceef3">extract.js: Pass 1 definitions</text>
    <text x="360" y="160" fill="#eceef3">linker.js: Pass 2 edges</text>
    <text x="360" y="184" fill="#eceef3">per-file purge + re-index (atomic)</text>
    <text x="360" y="208" fill="#eceef3">UNWIND batches of 500</text>
    <text x="360" y="232" fill="#eceef3">async embeddings (1536, cosine)</text>
  </g>
  <g>
    <rect x="650" y="60" width="280" height="200" rx="12" fill="#14161b" stroke="#c77dff"/>
    <text x="790" y="84" text-anchor="middle" fill="#c77dff" font-weight="700">Graph model (Neo4j)</text>
    <text x="670" y="112" fill="#eceef3">:CodeNode root label, 13 labels</text>
    <text x="670" y="136" fill="#eceef3">25 edge types (CALLS, IMPLEMENTS...)</text>
    <text x="670" y="160" fill="#eceef3">constraint unique_code_entity</text>
    <text x="670" y="184" fill="#eceef3">index code_embedding_idx (HNSW)</text>
    <text x="670" y="208" fill="#eceef3">db schemas: repo_name db:&lt;id&gt;</text>
    <text x="670" y="232" fill="#eceef3">:Table :Column HAS_COLUMN REFERENCES</text>
  </g>
  <g>
    <rect x="30" y="300" width="440" height="220" rx="12" fill="#14161b" stroke="#7fe0ff"/>
    <text x="250" y="324" text-anchor="middle" fill="#7fe0ff" font-weight="700">Database schema (ERD) flow</text>
    <text x="50" y="354" fill="#eceef3">connection (read-only user) -> introspect</text>
    <text x="50" y="378" fill="#eceef3">SQL: tables, columns, FKs; ODBC; Oracle</text>
    <text x="50" y="402" fill="#eceef3">Mongo: sample 50, depth 2, 60 fields</text>
    <text x="50" y="426" fill="#eceef3">relations: declared / inferred_name / inferred_llm</text>
    <text x="50" y="450" fill="#eceef3">schema-graph.js: modelToGraph -> replaceSchema</text>
    <text x="50" y="474" fill="#eceef3">auto-save on Sync up and Generate</text>
    <text x="50" y="498" fill="#eceef3">Delete: index only, needs authorization</text>
  </g>
  <g>
    <rect x="500" y="300" width="430" height="220" rx="12" fill="#14161b" stroke="#ff6b6b"/>
    <text x="715" y="324" text-anchor="middle" fill="#ff6b6b" font-weight="700">Safety and sync</text>
    <text x="520" y="354" fill="#eceef3">query_graph: read-only, writes -> 403</text>
    <text x="520" y="378" fill="#eceef3">repo and source DBs never modified</text>
    <text x="520" y="402" fill="#eceef3">delete_project: type name + "yes, delete my repo"</text>
    <text x="520" y="426" fill="#eceef3">stale repo reminder: keep 3 / 6 months</text>
    <text x="520" y="450" fill="#eceef3">POST /api/v1/sync {user_id, repo_name,</text>
    <text x="520" y="470" fill="#eceef3">  file_path, sha256, ast_json}</text>
    <text x="520" y="494" fill="#eceef3">codelense-client: systemd / NSSM / launchd</text>
  </g>
  <g stroke="#8a90a0" stroke-width="2" fill="none">
    <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a90a0"/></marker></defs>
    <path d="M310 160 H338" marker-end="url(#b)"/>
    <path d="M620 160 H648" marker-end="url(#b)"/>
    <path d="M250 298 V262" marker-end="url(#b)"/>
  </g>
</svg>
