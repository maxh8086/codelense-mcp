<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui,Segoe UI,sans-serif" font-size="13">
  <rect width="960" height="540" fill="#0c0d10"/>
  <text x="480" y="32" text-anchor="middle" fill="#eceef3" font-size="18" font-weight="700">codelense-mcp - High-level design</text>
  <g id="clients">
    <rect x="30" y="70" width="200" height="190" rx="12" fill="#14161b" stroke="#4d8dff"/>
    <text x="130" y="95" text-anchor="middle" fill="#4d8dff" font-weight="700">1. Clients</text>
    <text x="130" y="130" text-anchor="middle" fill="#eceef3">AI agents (MCP)</text>
    <text x="130" y="158" text-anchor="middle" fill="#eceef3">Admin web UI</text>
    <text x="130" y="186" text-anchor="middle" fill="#eceef3">codelense-client</text>
    <text x="130" y="206" text-anchor="middle" fill="#8a90a0" font-size="11">chokidar, 500 ms debounce</text>
  </g>
  <g id="server">
    <rect x="290" y="70" width="230" height="190" rx="12" fill="#14161b" stroke="#3ddc97"/>
    <text x="405" y="95" text-anchor="middle" fill="#3ddc97" font-weight="700">2. Server (Node ESM)</text>
    <text x="405" y="130" text-anchor="middle" fill="#eceef3">MCP tools: stdio + SSE /sse</text>
    <text x="405" y="158" text-anchor="middle" fill="#eceef3">REST /api/v1 (sync, erd, trace)</text>
    <text x="405" y="186" text-anchor="middle" fill="#eceef3">Optional bearer auth</text>
    <text x="405" y="214" text-anchor="middle" fill="#eceef3">Read-only guard (403 on writes)</text>
  </g>
  <g id="engine">
    <rect x="580" y="70" width="170" height="190" rx="12" fill="#14161b" stroke="#ffa94d"/>
    <text x="665" y="95" text-anchor="middle" fill="#ffa94d" font-weight="700">3. Indexing engine</text>
    <text x="665" y="130" text-anchor="middle" fill="#eceef3">Pass 1: Tree-sitter</text>
    <text x="665" y="150" text-anchor="middle" fill="#8a90a0" font-size="11">definitions (WASM)</text>
    <text x="665" y="182" text-anchor="middle" fill="#eceef3">Pass 2: linker</text>
    <text x="665" y="202" text-anchor="middle" fill="#8a90a0" font-size="11">heuristic CALLS / USAGE</text>
  </g>
  <g id="graph">
    <rect x="800" y="70" width="140" height="190" rx="12" fill="#14161b" stroke="#c77dff"/>
    <text x="870" y="95" text-anchor="middle" fill="#c77dff" font-weight="700">4. Graph DB</text>
    <text x="870" y="130" text-anchor="middle" fill="#eceef3">Neo4j 5</text>
    <text x="870" y="150" text-anchor="middle" fill="#8a90a0" font-size="11">bundled, swappable</text>
    <text x="870" y="182" text-anchor="middle" fill="#eceef3">tenant: user_id</text>
    <text x="870" y="202" text-anchor="middle" fill="#eceef3">repo_name</text>
  </g>
  <g id="ext">
    <rect x="290" y="320" width="230" height="150" rx="12" fill="#14161b" stroke="#ff6b6b"/>
    <text x="405" y="345" text-anchor="middle" fill="#ff6b6b" font-weight="700">5. Read-only sources</text>
    <text x="405" y="378" text-anchor="middle" fill="#eceef3">Your repo (never modified)</text>
    <text x="405" y="404" text-anchor="middle" fill="#eceef3">SQL / ODBC / Oracle / Mongo</text>
    <text x="405" y="430" text-anchor="middle" fill="#8a90a0" font-size="11">schema only, no row values</text>
  </g>
  <g id="llm">
    <rect x="580" y="320" width="250" height="150" rx="12" fill="#14161b" stroke="#7fe0ff"/>
    <text x="705" y="345" text-anchor="middle" fill="#7fe0ff" font-weight="700">LLM (optional)</text>
    <text x="705" y="378" text-anchor="middle" fill="#eceef3">Local or API endpoint</text>
    <text x="705" y="404" text-anchor="middle" fill="#eceef3">Guardrails: 50k approve,</text>
    <text x="705" y="424" text-anchor="middle" fill="#eceef3">100k strong warning, daily budget</text>
  </g>
  <g stroke="#8a90a0" stroke-width="2" fill="none" marker-end="url(#a)">
    <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a90a0"/></marker></defs>
    <path d="M230 165 H288"/>
    <path d="M520 165 H578"/>
    <path d="M750 165 H798"/>
    <path d="M405 262 V318"/>
    <path d="M580 395 H522"/>
  </g>
  <text x="480" y="510" text-anchor="middle" fill="#8a90a0" font-size="12">Read-only by design: only the codelense index is written (graph, annotations, ADRs, saved schemas).</text>
</svg>
